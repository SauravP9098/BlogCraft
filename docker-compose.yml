version: "3.8"

services:
  blogcraft:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blogcraft-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
