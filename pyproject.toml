[project]
name = "blog-writing-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SauravP9098", email = "pawarsourav416@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3==1.37.38",
    "fastapi==0.115.12",
    "glassflow-rius>=1.0,<2.0",
    "google-genai>=3.6.1",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "langchain-community>=0.3.27",
    "langchain-core>=0.3.86",
    "langgraph>=0.2,<2",
    "pinecone>=5,<9",
    "psycopg[binary,pool]==3.2.6",
    "pydantic-settings==2.8.1",
    "pypdf==5.4.0",
    "python-docx==1.1.2",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "uvicorn[standard]==0.34.2",
]

[project.scripts]
blog-writing-agent = "blog_writing_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
